databaseChangeLog:
  - changeSet:
      id: 1
      author: IvanShish
      comment: "Create refresh token table"
      preConditions:
        onFail: MARK_RAN
        onError: MARK_RAN
        not:
          tableExists:
            tableName: refresh_token
      changes:
        - createTable:
            tableName: refresh_token
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: create_date
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: token
                  type: varchar(512)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: expiry_date
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_refresh_token_user
                    references: user_entity(id)
        - addUniqueConstraint:
            tableName: refresh_token
            columnNames: user_id
        - addDefaultValue:
            tableName: refresh_token
            columnName: create_date
            defaultValueComputed: CURRENT_TIMESTAMP
