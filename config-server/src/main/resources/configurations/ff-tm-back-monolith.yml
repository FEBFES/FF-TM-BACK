spring:
  application:
    name: ff-tm-back-monolith
  boot:
    admin:
      client:
        url: ${config.path}:8095
  cloud:
    openfeign:
      okhttp:
        enabled: true
      httpclient:
        enabled: false
  autoconfigure:
    exclude:
      - net.devh.boot.grpc.client.autoconfigure.GrpcServerMetricAutoConfiguration
server:
  port: 8090
folders:
  user-pic: /home/febfes/userPics/
  task-files: /home/febfes/files/
management:
  endpoints:
    web:
      exposure:
        include: '*'
grpc:
  server:
    metrics:
      enabled: false
    port: 9091

feign:
  okhttp:
    max-idle-connections: 200
    keep-alive-duration-minutes: 5
    connect-timeout-millis: 500
    read-timeout-seconds: 2
    write-timeout-seconds: 2
    retry-on-connection-failure: true
